<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatFlow — Chat Colaborativo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 420px;
      height: 650px;
      background: #1a1a2e;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #6c63ff, #48cae4);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .header-info h2 {
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .header-info p {
      color: rgba(255,255,255,0.75);
      font-size: 12px;
    }

    #estado-conexion {
      margin-left: auto;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff4444;
    }
    #estado-conexion.conectado { background: #44ff88; }

    /* NOMBRE */
    .nombre-bar {
      background: #16213e;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #0f3460;
    }

    .nombre-bar input {
      flex: 1;
      background: #0f3460;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .nombre-bar button {
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .nombre-bar button:hover { background: #5a52e0; }

    /* MENSAJES */
    #mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #mensajes::-webkit-scrollbar { width: 4px; }
    #mensajes::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 4px; }

    /* Mensaje del sistema */
    .msg-sistema {
      text-align: center;
      font-size: 11px;
      color: #6c7a96;
      background: #16213e;
      padding: 4px 12px;
      border-radius: 20px;
      align-self: center;
    }

    /* Burbuja de mensaje */
    .burbuja {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      animation: aparecer 0.2s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mis mensajes */
    .burbuja.mio {
      background: linear-gradient(135deg, #6c63ff, #48cae4);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Mensajes de otros */
    .burbuja.otro {
      background: #16213e;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .burbuja .autor {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      opacity: 0.8;
    }

    .burbuja .hora {
      font-size: 10px;
      opacity: 0.6;
      text-align: right;
      margin-top: 4px;
    }

    /* INPUT */
    .input-area {
      padding: 12px 16px;
      background: #16213e;
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid #0f3460;
    }

    #input-mensaje {
      flex: 1;
      background: #0f3460;
      border: none;
      border-radius: 24px;
      padding: 12px 18px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: background 0.2s;
    }
    #input-mensaje:focus { background: #1a4a8a; }
    #input-mensaje::placeholder { color: #6c7a96; }

    .btn-circular {
      width: 42px; height: 42px;
      background: #0f3460;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.1s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-circular:hover { background: #1a4a8a; }

    #btn-enviar {
      background: linear-gradient(135deg, #6c63ff, #48cae4);
    }
    #btn-enviar:hover { transform: scale(1.1); }
    #btn-enviar:active { transform: scale(0.95); }

    /* PANEL EMOJIS */
    .panel-emojis {
      position: absolute;
      bottom: 75px;
      left: 16px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 10px;
      display: none;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .panel-emojis.activo { display: grid; }

    .panel-emojis button {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .panel-emojis button:hover { background: #0f3460; }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-icon">💬</div>
    <div class="header-info">
      <h2>ChatFlow</h2>
      <p>Chat Colaborativo en Tiempo Real</p>
    </div>
    <div id="estado-conexion" title="Estado de conexión"></div>
  </div>

  <!-- CAMBIAR NOMBRE -->
  <div class="nombre-bar">
    <input id="input-nombre" type="text" placeholder="Tu nombre (ej: Juan)..." maxlength="20"/>
    <button onclick="cambiarNombre()">Cambiar</button>
  </div>

  <!-- MENSAJES -->
  <div id="mensajes"></div>

  <!-- PANEL DE EMOJIS -->
  <div id="panel-emojis" class="panel-emojis"></div>

  <!-- INPUT MENSAJE -->
  <div class="input-area">
    <button class="btn-circular" onclick="toggleEmojis()" title="Emojis">😊</button>
    <input id="input-mensaje" type="text" placeholder="Escribe un mensaje..." autocomplete="off"/>
    <button id="btn-enviar" class="btn-circular" onclick="enviarMensaje()">➤</button>
  </div>

</div>

<script>
  // Conectar al servidor WebSocket
  const ws = new WebSocket("ws://localhost:3000");
  let miId = "";        // ID único asignado por el servidor
  let miNombre = "";    // Mi nombre actual

  // Lista de emojis populares
  const EMOJIS = [
    "😀","😂","😍","😎","🥰","😘","🤔","😢","😭","😡","🥺","😴",
    "👍","👎","👏","🙏","💪","🤝","👋","✌️","🤞","🤟","👌","🫶",
    "❤️","🔥","✨","🎉","🎊","💯","⭐","🌟","💖","💕","💔","💋",
    "🚀","💻","📱","☕","🍕","🍔","🌮","🍻","🎮","⚽","🏆","🎂"
  ];

  // Cuando se conecta
  ws.onopen = () => {
    document.getElementById("estado-conexion").classList.add("conectado");
  };

  // Cuando llega un mensaje
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // El servidor nos da nuestro ID y nombre al conectarnos
    if (data.tipo === "bienvenida") {
      miId = data.miId;
      miNombre = data.miNombre;
      document.getElementById("input-nombre").placeholder = `Tu nombre actual: ${miNombre}`;
      data.mensajes.forEach(mostrarMensaje);
      return;
    }

    // Cuando cambiamos nuestro nombre el servidor confirma
    if (data.tipo === "miNombreCambio") {
      miNombre = data.miNombre;
      document.getElementById("input-nombre").placeholder = `Tu nombre actual: ${miNombre}`;
      return;
    }

    if (data.tipo === "sistema") {
      mostrarSistema(data.texto);
      return;
    }

    mostrarMensaje(data);
  };

  // Cuando se desconecta
  ws.onclose = () => {
    document.getElementById("estado-conexion").classList.remove("conectado");
    mostrarSistema("Desconectado del servidor ❌");
  };

  // Mostrar mensaje de chat (compara por ID único, no por nombre)
  function mostrarMensaje(msg) {
    const div = document.createElement("div");
    div.classList.add("burbuja");
    div.classList.add(msg.autorId === miId ? "mio" : "otro");
    div.innerHTML = `
      <div class="autor">${escapar(msg.autor)}</div>
      <div>${escapar(msg.texto)}</div>
      <div class="hora">${msg.hora}</div>
    `;
    agregarAlChat(div);
  }

  // Escapar HTML para evitar inyección
  function escapar(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  // Mostrar mensaje del sistema
  function mostrarSistema(texto) {
    const div = document.createElement("div");
    div.classList.add("msg-sistema");
    div.textContent = texto;
    agregarAlChat(div);
  }

  // Agregar elemento y hacer scroll
  function agregarAlChat(el) {
    const chat = document.getElementById("mensajes");
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  // Enviar mensaje
  function enviarMensaje() {
    const input = document.getElementById("input-mensaje");
    const texto = input.value.trim();
    if (!texto || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ tipo: "mensaje", texto }));
    input.value = "";
    document.getElementById("panel-emojis").classList.remove("activo");
  }

  // Cambiar nombre
  function cambiarNombre() {
    const input = document.getElementById("input-nombre");
    const nombre = input.value.trim();
    if (!nombre) return;
    ws.send(JSON.stringify({ tipo: "cambiarNombre", nombre }));
    input.value = "";
  }

  // Mostrar/ocultar panel de emojis
  function toggleEmojis() {
    const panel = document.getElementById("panel-emojis");
    panel.classList.toggle("activo");
  }

  // Llenar el panel de emojis
  function cargarEmojis() {
    const panel = document.getElementById("panel-emojis");
    EMOJIS.forEach((e) => {
      const btn = document.createElement("button");
      btn.textContent = e;
      btn.onclick = () => {
        document.getElementById("input-mensaje").value += e;
        document.getElementById("input-mensaje").focus();
      };
      panel.appendChild(btn);
    });
  }
  cargarEmojis();

  // Enter para enviar mensaje
  document.getElementById("input-mensaje").addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviarMensaje();
  });

  // Enter para cambiar nombre
  document.getElementById("input-nombre").addEventListener("keydown", (e) => {
    if (e.key === "Enter") cambiarNombre();
  });
</script>

</body>
</html>
